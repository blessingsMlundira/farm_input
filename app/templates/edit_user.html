{% extends "base.html" %}

{% block title %}Edit User | E-Farm System{% endblock %}

{% block content %}

<div class="mb-4">
    <h3 class="fw-bold text-success">
        <i class="fa-solid fa-user-pen"></i> Edit User
    </h3>
    <p class="text-muted">
        Update the user's username, password, or account type.
    </p>
</div>

<div class="dashboard-card">


<form action="{{ url_for('edit_user', user_id=user.id) }}" method="POST">

    <div class="row g-4">

        <!-- Username -->
        <div class="col-md-6">
            <label class="form-label">Username</label>

            <input
                name="username"
                type="text"
                class="form-control"
                value="{{ user.username }}"
                placeholder="Enter username"
                required
            >
        </div>


        <!-- Password -->
        <div class="col-md-6">
            <label class="form-label">
                New Password
            </label>

            <input
                name="password"
                type="password"
                class="form-control"
                placeholder="Leave blank to keep current password"
            >

            <small class="text-muted">
                Leave this field blank if you do not want to change the password.
            </small>
        </div>


        <!-- Account Type -->
        <div class="col-md-6">

            <label class="form-label">
                Account Type
            </label>

            <select
                name="account_type"
                class="form-select"
                required
            >

                <option value="">Select Account Type</option>

                <option
                    value="administrator"
                    {% if user.account_type == 'administrator' %}
                        selected
                    {% endif %}
                >
                    Administrator
                </option>

                <option
                    value="registration officer"
                    {% if user.account_type == 'registration officer' %}
                        selected
                    {% endif %}
                >
                    Registration Officer
                </option>

                <option
                    value="disbursement officer"
                    {% if user.account_type == 'disbursement officer' %}
                        selected
                    {% endif %}
                >
                    Disbursement Officer
                </option>

                <option
                    value="collection officer"
                    {% if user.account_type == 'collection officer' %}
                        selected
                    {% endif %}
                >
                    Collection Officer
                </option>

            </select>

        </div>

    </div>


    <!-- Buttons -->
    <div class="mt-4 d-flex justify-content-between">

        <a
            href="{{ url_for('add_user') }}"
            class="btn btn-outline-secondary"
        >
            <i class="fa-solid fa-arrow-left"></i>
            Back
        </a>


        <button
            type="submit"
            class="btn btn-success"
        >
            <i class="fa-solid fa-floppy-disk"></i>
            Save Changes
        </button>

    </div>

</form>


</div>

{% endblock %}
